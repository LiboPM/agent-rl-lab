### Stage 1 SFT Baseline: ToolRL (RLLA-4k) Full-Parameter SFT on Qwen3-4B-Base-rlla
###
### Why `template` is omitted (auto-parsed from `tokenizer.chat_template`):
###   1. `models/Qwen3-4B-Base-rlla` strips untrained added tokens 151644..151668 and keeps
###      only the trained `<|endoftext|>` (151643) as `eos_token`.
###   2. When `template` is omitted, LLaMA-Factory's `parse_template()` reads the model's
###      Jinja `chat_template` directly (`replace_eos=False`), preserving `eos_token=<|endoftext|>`
###      (151643) and ensuring 100% token-level prompt/response alignment with VeRL `RLHFDataset`.

### model
model_name_or_path: /home/ma-user/work/LB/github/agent-rl-lab/models/Qwen3-4B-Base-rlla
trust_remote_code: true
flash_attn: fa2

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: /home/ma-user/work/LB/LlamaFactory/examples/deepspeed/ds_z2_config.json

### dataset
